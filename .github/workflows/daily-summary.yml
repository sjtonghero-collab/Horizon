name: Daily Horizon Summary

on:
  schedule:
    # 每天 07:00 北京时间（23:00 UTC）
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --extra twitter

      - name: Install Chromium for X scraping
        run: uv run playwright install chromium --with-deps

      - name: Prepare config
        run: cp data/config.github.json data/config.json

      - name: Write X cookies
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          mkdir -p data
          if [ -n "$X_COOKIES" ]; then
            printf '%s' "$X_COOKIES" > data/x_cookies_1.json
            echo "X cookies written"
          else
            echo "No X_COOKIES secret; X scraping will be skipped"
          fi

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24

      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
