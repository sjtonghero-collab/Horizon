name: debug-x2
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - name: Install
        run: |
          uv sync --extra twitter
          uv run playwright install chromium --with-deps
      - name: Write cookies
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          mkdir -p data
          printf '%s' "$X_COOKIES" > data/x_cookies_1.json
      - name: Headed test under xvfb
        run: |
          cat > /tmp/t.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          cookies = json.load(open("data/x_cookies_1.json"))
          with sync_playwright() as p:
              b = p.chromium.launch(headless=False, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 800},
                  locale="en-US",
              )
              ctx.add_cookies(cookies)
              page = ctx.new_page()
              page.goto("https://x.com/home", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(8000)
              print("TITLE:", repr(page.title()))
              print("URL:", page.url)
              txt = page.inner_text("body")[:400].replace("\n", " | ")
              print("BODY:", txt)
              b.close()
          PY
          xvfb-run -a uv run python /tmp/t.py
