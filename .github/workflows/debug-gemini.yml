name: debug-gemini
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: List models
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          curl -s "https://generativelanguage.googleapis.com/v1beta/models" -H "x-goog-api-key: $GOOGLE_API_KEY" -o out.json -w "HTTP:%{http_code}\n"
          head -c 1200 out.json
      - name: Test generate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "--- gemini-2.5-flash-lite:"
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" -H "x-goog-api-key: $GOOGLE_API_KEY" -H "Content-Type: application/json" -d '{"contents":[{"parts":[{"text":"say OK"}]}]}' -w "\nHTTP:%{http_code}\n" | head -c 600
