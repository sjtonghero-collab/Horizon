name: debug-gemini
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Test generate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          for M in gemini-3.5-flash-lite gemini-3.5-flash gemini-2.5-flash; do
            echo "=== $M"
            curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" -H "x-goog-api-key: $GOOGLE_API_KEY" -H "Content-Type: application/json" -d '{"contents":[{"parts":[{"text":"say OK"}]}]}' -w "\nHTTP:%{http_code}\n" | head -c 400
            echo
          done
